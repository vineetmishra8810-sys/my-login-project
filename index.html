<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="data.css">
</head>
<body>
    <div class="box">
        <form>
            <h1>Login</h1>

            <div>
                <label for="first" style="display: block;">Username</label>
                <input type="text" id="first" placeholder="Enter your username" style="display: block;">
            </div>

            <div>
                <label for="second" style="display: block;">Password</label>
                <input type="password" id="second" placeholder="Enter your password" style="display: block;">
            </div>

            <button style="width: 100%; height: 40px; font-size: 20px; padding: 5px; background-color: #10304a; color: #e7f1df;" type="submit">Login</button>
            <br>
            <p style="text-align: center; margin-top: 4px;">Forgot your Password</p>
        </form>
    </div>
    
</body>
</html>
